name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck

  unit-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run test:cov

  e2e-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: nestjs_demo
          POSTGRES_PASSWORD: nestjs_demo
          POSTGRES_DB: nestjs_demo
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nestjs_demo"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://nestjs_demo:nestjs_demo@localhost:5432/nestjs_demo
      JWT_ACCESS_SECRET: ci-test-secret-at-least-32-characters-long
      ADMIN_BOOTSTRAP_EMAIL: admin@example.com
      ADMIN_BOOTSTRAP_PASSWORD: ChangeMe123!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy --config prisma7.config.ts
      # Schema đã sửa mà quên tạo migration → fail
      - name: Check schema/migration drift
        run: npx prisma migrate diff --config prisma7.config.ts --from-config-datasource --to-schema prisma/schema --exit-code
      - run: npm run db:seed
      - run: npm run test:e2e

  docs-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: lycheeverse/lychee-action@v2
        with:
          args: --offline --no-progress --include-fragments './**/*.md' --exclude-path node_modules
          fail: true

  build:
    runs-on: ubuntu-latest
    needs: [lint, typecheck, unit-test, e2e-test]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run build
      - run: docker build -t nestjs-demo:ci .
