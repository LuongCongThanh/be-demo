name: OpenAPI release

# Publishes a GitHub Release with the docs/openapi/openapi.json of a tagged commit.
# openapi-version.yml calls it after tagging a new Contract Version on dev; pushing an
# `openapi-v*` tag by hand or running it manually still works.
# The CMS and Storefront pin the tagged asset URL:
#   https://github.com/<owner>/<repo>/releases/download/<tag>/openapi.json
on:
  push:
    tags: ['openapi-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release again (for example, openapi-v1.0.0)
        required: true
  workflow_call:
    inputs:
      tag:
        description: Tag to release
        type: string
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Check the contract file exists
        run: test -s docs/openapi/openapi.json
      - name: Create or update the release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" docs/openapi/openapi.json --clobber
          else
            gh release create "$TAG" docs/openapi/openapi.json --title "$TAG" --notes "OpenAPI contract at $(git rev-parse --short HEAD)"
          fi
