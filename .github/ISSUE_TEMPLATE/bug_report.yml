name: Bug report
description: Báo lỗi — hệ thống chạy sai so với BR/US đã chốt
title: 'fix(<module>): <mô tả ngắn lỗi>'
labels: [bug, needs-triage]
body:
  - type: dropdown
    id: module
    attributes:
      label: Module
      options:
        [
          identity,
          catalog,
          pricing,
          cart,
          inventory,
          ordering,
          payments,
          refunds-returns,
          fulfillment,
          notifications,
          compliance,
          admin-config,
          hạ tầng/CI,
          khác,
        ]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: Hiện tượng
      description: Chuyện gì xảy ra? Kèm request-id nếu có (header `x-request-id`).
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Các bước tái hiện
      placeholder: |
        1. POST /api/v1/...
        2. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Kết quả mong đợi
      description: Trích BR-*/US-* liên quan nếu có.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Log / response lỗi
      description: Che PII (email, SĐT, địa chỉ) trước khi dán.
      render: shell
  - type: dropdown
    id: env
    attributes:
      label: Môi trường
      options: [local, CI, staging, production]
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Mức độ
      options: ['P1 — sai tiền/tồn kho/mất dữ liệu', 'P2 — chặn luồng chính', 'P3 — có cách né', 'P4 — hiển thị/nhỏ']
    validations:
      required: true
